name: Quantum Industries Java compile
on:
  push:
    branches:
      - feature/v0.1.1-conductivity-research
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile mod and process resources
        run: bash ./gradlew --no-daemon compileJava processResources
