name: Quantum Industries Java compile
on:
  push:
    branches:
      - main
      - feature/v0.1.1-conductivity-research
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check contracts and resources
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify research migration and scientific progression
        run: |
          mkdir -p build/dynamo-verification/world
          printf 'eula=true\n' > build/dynamo-verification/world/eula.txt
          printf 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25577\nmax-tick-time=0\nview-distance=2\nsimulation-distance=2\n' > build/dynamo-verification/world/server.properties
          bash ./gradlew --no-daemon --init-script tests/dynamo.init.gradle runServer
          python3 -c "from pathlib import Path; result=Path('build/dynamo-verification/result.txt').read_text(); print(result); assert result.startswith('PASS:')"
      - name: Compile and package mod
        run: bash ./gradlew --no-daemon build
      - name: Upload testable mod jar
        uses: actions/upload-artifact@v4
        with:
          name: quantum-industries-neoforge-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
