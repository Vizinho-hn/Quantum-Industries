// Isolated visual fixture; never included in the normal production source set.
allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir('tests/qks-preview')
        neoForge.runs.client {
            gameDirectory = file('build/qks-preview')
            systemProperty 'quantumindustries.previewQks', 'true'
            programArguments.addAll '--quickPlaySingleplayer', 'QksQA', '--width', '1280', '--height', '800'
        }
        // Quick Play expects saves/QksQA to exist, as in mechanical-preview's isolated world.
        def previewOptions = file('build/qks-preview/options.txt')
        tasks.named('runClient').configure {
            doFirst {
                previewOptions.parentFile.mkdirs()
                previewOptions.setText('onboardAccessibility:false\npauseOnLostFocus:false\nlang:en_us\nguiScale:2\ntutorialStep:none\nfov:0.0\n', 'UTF-8')
            }
        }
    }
}
