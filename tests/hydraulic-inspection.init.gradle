allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir('tests/hydraulic-inspection-runtime')
        neoForge.runs.server {
            gameDirectory = file(providers.gradleProperty('hydraulicInspectionRunDir').getOrElse('build/hydraulic-inspection') + '/world')
            systemProperty 'quantumindustries.verifyHydraulicInspection', 'true'
            jvmArgument '-Xlog:class+load=info:file=../classes-%p.log:uptime,level,tags'
        }
    }
}
