// Opt-in server integration harness. Keep the world and results isolated from normal play.
allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir('tests')
        neoForge.runs.server {
            gameDirectory = file('build/dynamo-verification/world')
            systemProperty 'quantumindustries.verifyDynamo', 'true'
        }
    }
}
